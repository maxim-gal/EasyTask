<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTask — События + Приоритеты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Экран авторизации -->
<div id="authScreen" class="screen active-screen">
    <div class="auth-container">
        <h2>EasyTask</h2>
        <div class="auth-tabs">
            <button id="authLoginTab" class="auth-tab active">Вход</button>
            <button id="authRegisterTab" class="auth-tab">Регистрация</button>
        </div>
        <form id="loginForm" class="auth-form active-form">
            <input type="text" id="loginUsername" placeholder="Имя пользователя или Email" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button type="submit" class="btn-primary">Войти</button>
            <div id="loginError" class="error-message"></div>
        </form>
        <form id="registerForm" class="auth-form">
            <input type="text" id="regUsername" placeholder="Имя пользователя" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Пароль" required>
            <input type="text" id="regFullName" placeholder="Полное имя (необязательно)">
            <button type="submit" class="btn-primary">Зарегистрироваться</button>
            <div id="regError" class="error-message"></div>
        </form>
    </div>
</div>

<!-- Основное приложение (скрыто до авторизации) -->
<div id="appScreen" class="screen" style="display: none;">
    <div class="app">
        <div class="tabs">
            <button class="tab-btn active" data-screen="eventsList">📅 События</button>
            <button class="tab-btn" data-screen="addEvent">➕ Добавить</button>
            <button class="tab-btn" data-screen="stats">📊 Статистика</button>
            <button class="tab-btn" data-screen="about">ℹ️ О проекте</button>
            <button id="logoutBtn" class="tab-btn" style="color: #ef4444;">🚪 Выйти</button>
        </div>

        <div id="eventsList" class="screen active-screen">
            <h2>Мои события</h2>
            <div class="controls-row">
                <div class="filter-buttons" id="filterButtons">
                    <button data-filter="all" class="filter-btn active-filter">Все</button>
                    <button data-filter="active" class="filter-btn">Активные</button>
                    <button data-filter="completed" class="filter-btn">Выполненные</button>
                </div>
                <input type="text" id="searchInput" placeholder="🔍 Поиск по названию...">
            </div>
            <div id="eventsContainer"></div>
            <div id="noEvents" class="empty-message"></div>
        </div>

        <div id="addEvent" class="screen">
            <h2 id="formTitle">Новое событие</h2>
            <form id="eventForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-group">
                    <label>Дата события *</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label>Время события *</label>
                    <input type="time" id="eventTime" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="eventDesc" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Приоритет</label>
                    <select id="eventPriority">
                        <option value="high">🔥 Высокий</option>
                        <option value="medium" selected>🟡 Средний</option>
                        <option value="low">⚪ Низкий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Приватное событие?</label>
                    <select id="eventPrivate">
                        <option value="false">Общее (видят все)</option>
                        <option value="true">Приватное (только я)</option>
                    </select>
                </div>
                <div class="form-group" id="completedGroup" style="display: none;">
                    <label>
                        <input type="checkbox" id="eventCompleted"> Выполнено
                    </label>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <button type="button" id="cancelEditBtn" class="btn-secondary">Отмена</button>
                </div>
            </form>
        </div>

        <div id="stats" class="screen">
            <h2>Статистика</h2>
            <div class="stats-grid" id="statsInfo"></div>
        </div>

        <div id="about" class="screen">
            <h2>EasyTask — События + Приоритеты</h2>
            <p>Управляйте событиями с таймерами, приоритетами и комментариями.</p>
            <p>Фильтрация по статусу, поиск, приватность.</p>
        </div>
    </div>
</div>

<div id="eventModal" class="modal-overlay">
    <div class="modal-window">
        <div class="modal-header">
            <h3 id="modalEventTitle">Событие</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
        </div>
        <div id="modalEventContent"></div>
        <hr>
        <h4>Комментарии</h4>
        <div id="modalCommentsList"></div>
        <div class="form-group">
            <label>Ваш комментарий</label>
            <textarea id="newCommentText" rows="2" placeholder="Напишите комментарий..."></textarea>
            <button id="addCommentBtn" class="btn-primary">Добавить комментарий</button>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
